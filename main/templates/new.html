    <script type="text/javascript">
        let TestElements = document.getElementsByClassName('main-test')
        let sas1 = document.getElementsByClassName('sas1')[0];
        let one = document.getElementById('1')
        let two = document.getElementById('2')
        let three = document.getElementById('3')
        let four = document.getElementById('4')
        let arrow_down = document.getElementById('a-up')
        let arrow_up = document.getElementById('a-down')
        let key = document.getElementsByClassName('keyboard')[0];
        let memory = document.getElementById('memory')
        let q = -1
        let save = {}

        function downloadHTML(elementSelector = 'body', outputFilename = 'page-content.html') {

            // 1. گرفتن المان مورد نظر
            const element = document.querySelector(elementSelector);
            if (!element) {
                console.error("Element not found!");
                return;
            }

            // 2. گرفتن HTML المان
            let htmlContent = element.outerHTML;

            // 3. گرفتن استایل‌های سراسری صفحه (که ممکنه روی المان انتخابی تاثیر بذارن)
            const styles = document.head.querySelectorAll('style');
            let cssString = '';
            styles.forEach(style => {
                cssString += style.outerHTML;
            });

            // 4. گرفتن لینک‌های CSS خارجی (اگر وجود دارند)
            const linkTags = document.head.querySelectorAll('link[rel="stylesheet"]');
            let cssLinks = '';
            linkTags.forEach(link => {
                // اینجا می‌تونیم لینک رو هم داخل تگ style کپی کنیم، ولی برای آفلاین بودن باید خود CSS رو دانلود کنیم.
                // برای سادگی الان فقط تگش رو نگه می‌داریم، ولی برای آفلاین کامل باید CSS رو هم inline کرد.
                cssLinks += link.outerHTML;
            });

            // 5. ترکیب همه چیز در یک فایل HTML
            // اینجا مهمه که استایل‌ها قبل از محتوا بیان تا تاثیر بذارن
            const finalHtml = `
            < !DOCTYPE html >
        <html>
            <head>
                <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Saved Page Content</title>
                        ${cssString}
                        ${cssLinks} <!-- این تگ‌ها برای آفلاین بودن باید با CSS واقعی جایگزین بشن -->
                    </head>
                    <body>
                        ${htmlContent}
                    </body>
                </html>
    `;

            // 6. ساخت فایل blob و لینک دانلود
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = outputFilename;
            document.body.appendChild(link);
            link.click();

            // پاکسازی
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        sas1.addEventListener('click', () => { if (sas1.innerHTML == 'مشاهده کیبورد') { key.style.display = 'flex'; sas1.innerHTML = 'پنهان کردن کیبورد'; } else { key.style.display = 'none'; sas1.innerHTML = 'مشاهده کیبورد'; } })
        // --- نحوه استفاده ---

        // اگر می‌خوای کل صفحه ذخیره بشه:
        // savePageAsSingleHtml();

        // اگر می‌خوای فقط یه div خاص (مثلا با id="myForm") ذخیره بشه:
        // savePageAsSingleHtml('#myForm', 'my-form-content.html');

        // حالا دکمه‌ای که قبلا داشتیم رو تغییر می‌دیم:
        // <button onclick="savePageAsSingleHtml()">دانلود محتوای صفحه به صورت HTML</button>
        // یا برای یک بخش خاص:
        // <button onclick="savePageAsSingleHtml('#myForm', 'my-form-content.html')">دانلود فرم من</button>
        function handlekey(event) {

            if (event.key == 'ArrowUp') {
                q -= 1
            }
            if (q > TestElements.length) {
                alert("تستها پایان یافتند")
                return
            }
            console.log(event)
            const pressedkey = event.key
            if (pressedkey == 'ArrowDown') {
                q += 1
                save[q] = 0
            } if (pressedkey == 1) {
                q += 1
                save[q] = 1
                console.log(TestElements[q].children[1].children[0]);
                TestElements[q].children[1].children[0].checked = true
            } if (pressedkey == 2) {
                q += 1
                save[q] = 2
                console.log(TestElements[q].children[1].children[0]);
                TestElements[q].children[2].children[0].checked = true
            } if (pressedkey == 3) {
                q += 1
                save[q] = 2
                console.log(TestElements[q].children[1].children[0]);
                TestElements[q].children[3].children[0].checked = true
            } if (pressedkey == 4) {
                q += 1
                save[q] = 4
                console.log(TestElements[q].children[1].children[0]);
                TestElements[q].children[4].children[0].checked = true
            }
            TestElements[q + 1].className = 'main-test selected'
            if (q != -1) {
                TestElements[q].className = 'main-test'
            }
            TestElements[q + 2].className = 'main-test'
            memory.innerHTML = JSON.stringify(save)

        };

        one.addEventListener("click", () => { handlekey({ key: '1' }) })
        two.addEventListener("click", () => { handlekey({ key: '2' }) })
        three.addEventListener("click", () => { handlekey({ key: '3' }) })
        four.addEventListener("click", () => { handlekey({ key: '4' }) })
        arrow_up.addEventListener("click", () => { handlekey({ key: 'ArrowDown' }) })
        arrow_down.addEventListener("click", () => { handlekey({ key: 'ArrowUp' }) })
        document.addEventListener('keydown', handlekey);


    </script>
    <button class="sas" onclick="downloadHTML()">ذخیره</button>
